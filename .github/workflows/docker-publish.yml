# ============================================================================
# docker-publish.yml — Publish Docker image to GHCR + GitHub Release
# ============================================================================
#
# Triggers ONLY on merge/push to master (plus manual dispatch for rebuilds).
# The branch/PR pipeline lives in ci.yml.
#
# Job order (a release is only created if the image publishes successfully):
#
#   1. version → determine next tag: v1.0.27 → v1.0.28 on merge to master;
#                on manual dispatch reuse the latest tag (rebuild, no release)
#   2. docker  → build multi-arch image and push to GHCR
#   3. release → create tag + GitHub Release with AUTO-GENERATED notes
#                ("What's Changed" lists every commit/PR since the previous
#                release). Skipped on manual dispatch.
#
# Tagging strategy (release-version aligned):
#   - First build of a release:   1.0.28
#   - Rebuild of the same release: 1.0.28.1, 1.0.28.2, ...
#
# The docker job queries existing GHCR tags via the GitHub Packages API to
# determine the next available suffix for the current release version.
#
# Published tags per build:
#   - <version-tag>   (e.g. 1.0.28 or 1.0.28.1)
#   - latest
#   - sha-<short>     (Git commit SHA for traceability)
#
# ============================================================================

name: Release & Publish Docker

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # ── Job 1: Determine release version ─────────────────────────────────────
  # On merge to master: bump patch from the latest v* tag (v1.0.27 → v1.0.28).
  # On manual dispatch: reuse the latest tag so the image is rebuilt without
  # creating a new release.
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine release version
        id: version
        run: |
          set -eu
          git fetch --tags --force
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -1)

          if [ -z "$LATEST_TAG" ]; then
            # No previous release: start at the initial version.
            TAG="v1.0.1"
          elif [ "${{ github.event_name }}" = "push" ]; then
            # Merge to master: bump the patch segment.
            BASE="${LATEST_TAG#v}"
            MAJOR="${BASE%%.*}"
            MINOR="$(echo "$BASE" | cut -d. -f2)"
            PATCH="$(echo "$BASE" | cut -d. -f3)"
            TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          else
            # Manual dispatch: rebuild the latest release as-is.
            TAG="$LATEST_TAG"
          fi

          echo "Previous tag: ${LATEST_TAG:-none} → Release tag: ${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  # ── Job 2: Build and push Docker image ───────────────────────────────────
  # Uses the version computed by the `version` job, then queries GHCR for
  # existing tags to pick the correct suffix for rebuilds.
  docker:
    runs-on: ubuntu-latest
    needs: version
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}
    steps:
      # ── Checkout (full history + tags) ───────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ── Lowercase image name (GHCR requirement) ──────────────────────────
      - name: Set lowercase image name
        run: |
          IMAGE_NAME="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_NAME=${IMAGE_NAME}" >> "$GITHUB_ENV"

      # ── Compute final image tag with consecutive suffix ──────────────────
      # Queries the GitHub Packages API for existing container tags matching
      # the release version and increments the suffix if the base tag exists.
      - name: Compute image tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu

          VERSION="${{ needs.version.outputs.version }}"
          OWNER="${{ github.repository_owner }}"
          PACKAGE="${GITHUB_REPOSITORY##*/}"

          # ── Fetch existing tags from GitHub Container Registry ────────────
          # Try user-scoped endpoint first, fall back to org-scoped.
          # Returns one tag name per line.
          EXISTING_TAGS="$(curl -sf \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/${OWNER}/packages/container/${PACKAGE}/tags?per_page=100" \
            2>/dev/null | jq -r '.[].name? // empty' 2>/dev/null)"

          if [ -z "$EXISTING_TAGS" ]; then
            EXISTING_TAGS="$(curl -sf \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/orgs/${OWNER}/packages/container/${PACKAGE}/tags?per_page=100" \
              2>/dev/null | jq -r '.[].name? // empty' 2>/dev/null)"
          fi

          # ── Find the highest consecutive suffix for this version ──────────
          BASE_EXISTS=0
          MAX_SUFFIX=0

          while IFS= read -r tag_name; do
            [ -z "$tag_name" ] && continue

            if [ "$tag_name" = "$VERSION" ]; then
              BASE_EXISTS=1
            elif [[ "$tag_name" == "${VERSION}."* ]]; then
              suffix="${tag_name##*.}"
              if [[ "$suffix" =~ ^[0-9]+$ ]] && [ "$suffix" -gt "$MAX_SUFFIX" ]; then
                MAX_SUFFIX="$suffix"
              fi
            fi
          done <<< "$EXISTING_TAGS"

          # ── Determine final tag ───────────────────────────────────────────
          if [ "$BASE_EXISTS" -eq 1 ] || [ "$MAX_SUFFIX" -gt 0 ]; then
            FINAL_TAG="${VERSION}.$(( MAX_SUFFIX + 1 ))"
          else
            FINAL_TAG="${VERSION}"
          fi

          echo "Computed image tag: ${FINAL_TAG}"
          echo "tag=${FINAL_TAG}" >> "$GITHUB_OUTPUT"

      # ── Set up QEMU (cross-arch emulation for linux/arm64) ────────────────
      # Enables building linux/arm64 images on the amd64 GitHub runner.
      # Required for Apple Silicon macOS (Docker Desktop runs arm64).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # ── Set up BuildKit ───────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Authenticate to GHCR ─────────────────────────────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Extract metadata (labels, annotations) ──────────────────────────
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=taan-mind
            org.opencontainers.image.description=Paperless-ngx conversational AI UI
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # ── Build and push ───────────────────────────────────────────────────
      # provenance: false avoids the 403 error on GHCR push (disables OIDC
      # provenance attestation which requires extra token permissions).
      # Build-args mirror docker-compose.yml for consistent local/CI builds.
      # GHA cache (cache-from/cache-to) speeds up subsequent builds.
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: true
          provenance: false
          platforms: linux/amd64,linux/arm64
          build-args: |
            NODE_VERSION=24.19.0
            PNPM_VERSION=10.34.3
            BUILD_NODE_OPTIONS=--max-old-space-size=4096
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Job summary ──────────────────────────────────────────────────────
      - name: Publish build summary
        run: |
          {
            echo "### Docker Image Published"
            echo ""
            echo "| Tag | Image Reference |"
            echo "|-----|-----------------|"
            echo "| \`${{ steps.tag.outputs.tag }}\` | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}\` |"
            echo "| \`latest\` | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\` |"
            echo "| \`sha-${{ github.sha }}\` | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}\` |"
            echo ""
            echo "> \`docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Job 3: Create GitHub Release (push to master only) ───────────────────
  # Runs ONLY after the image was published successfully, so a broken Docker
  # build never leaves an orphan release. `--generate-notes` makes GitHub
  # auto-generate the "What's Changed" section with every commit/PR merged
  # since the previous release tag.
  release:
    runs-on: ubuntu-latest
    needs: [version, docker]
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          IMAGE_TAG: ${{ needs.docker.outputs.image-tag }}
        run: |
          set -eu
          IMAGE_NAME="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"

          gh release create "$TAG" \
            --repo '${{ github.repository }}' \
            --target '${{ github.sha }}' \
            --title "$TAG" \
            --generate-notes \
            --notes "Published Docker image: \`${{ env.REGISTRY }}/${IMAGE_NAME}:${IMAGE_TAG}\`

          \`\`\`
          docker pull ${{ env.REGISTRY }}/${IMAGE_NAME}:${IMAGE_TAG}
          \`\`\`
          "

          echo "### GitHub Release Created" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Release [\`$TAG\`](${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG) with auto-generated commit notes." >> "$GITHUB_STEP_SUMMARY"
