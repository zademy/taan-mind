# ============================================================================
# ci.yml — Quality checks + Docker build test (branches & PRs, NOT master)
# ============================================================================
#
# Runs on every push to a non-master branch and every PR targeting master:
#
#   1. quality     → lint, format check, typecheck, full Nuxt build test
#   2. docker-test → build the Docker image WITHOUT publishing (linux/amd64)
#
# Merge to master is what triggers the real publish (docker-publish.yml).
# Mark both jobs as required status checks on master (branch protection) so
# merging is blocked until the build is proven.
#
# Triggers:
#   - push          → any branch except master
#   - pull_request  → targeting master
#
# ============================================================================

name: ci

on:
  push:
    branches-ignore:
      - master
  pull_request:
    branches:
      - master

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Quality gate (lint + format + types + build test) ─────────────
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build test
        run: pnpm run build

  # ── Job 2: Docker build test (no push) ───────────────────────────────────
  # Validates the image constructs cleanly BEFORE merge. Single platform
  # keeps it fast; the multi-arch build (amd64+arm64) happens at publish
  # time in docker-publish.yml. Build-args mirror docker-compose.yml.
  docker-test:
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: false
          platforms: linux/amd64
          provenance: false
          build-args: |
            NODE_VERSION=24.19.0
            PNPM_VERSION=10.34.3
            BUILD_NODE_OPTIONS=--max-old-space-size=4096
          cache-from: type=gha
          cache-to: type=gha,mode=max
