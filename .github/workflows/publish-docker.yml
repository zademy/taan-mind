name: Publish Docker image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git tag to build and publish (for example, v1.2.3)
        required: true
        type: string
      publish_latest:
        description: Also update the latest tag
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      tag:
        description: Existing Git tag to build and publish
        required: true
        type: string
      publish_latest:
        description: Also update the latest tag
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: zademy/taan-mind
  NODE_VERSION: 24.16.0
  PNPM_VERSION: 10.33.4
  BUILD_NODE_OPTIONS: --max-old-space-size=3072
  PUBLISH_TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  build-and-push:
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: refs/tags/${{ env.PUBLISH_TAG }}

      - name: Verify Git tag checkout
        shell: bash
        run: |
          if [[ "${PUBLISH_TAG}" == "latest" ]]; then
            echo "::error::The reserved container tag 'latest' cannot be used as a Git tag input."
            exit 1
          fi

          git check-ref-format "refs/tags/${PUBLISH_TAG}"
          expected_commit="$(git rev-parse "refs/tags/${PUBLISH_TAG}^{commit}")"
          actual_commit="$(git rev-parse HEAD)"

          if [[ "${actual_commit}" != "${expected_commit}" ]]; then
            echo "::error::Checked-out commit does not match refs/tags/${PUBLISH_TAG}."
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.PUBLISH_TAG }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' || inputs.publish_latest }}

      - name: Build and push image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
            PNPM_VERSION=${{ env.PNPM_VERSION }}
            BUILD_NODE_OPTIONS=${{ env.BUILD_NODE_OPTIONS }}
          cache-from: type=gha,scope=taan-mind
          cache-to: type=gha,mode=max,scope=taan-mind
          provenance: mode=max
